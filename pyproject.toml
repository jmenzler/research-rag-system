[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "Hybrid retrieval, citation-graph, and research workflow system"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pymilvus>=2.4.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "backports.zstd>=1.7.0; python_version < '3.14'",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.27.0",
    "openai>=1.0.0",
    "curl-cffi>=0.7.0",
    "trafilatura>=2.0.0",
    "requests>=2.32.0",
    "scrapling[fetchers]>=0.4.0",
    "jsonref>=1.1.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "httpx>=0.28.1",
    "duckdb>=1.5.0",
    "kuzu>=0.11.3",
]

[project.optional-dependencies]
pdf = [
    "mlx-vlm>=0.4.4; sys_platform == 'darwin'",
    "mineru>=3.1.6",
    "albumentations>=2.0.8",
    "ftfy>=6.3.1",
    "timm>=1.0.26",
]
dev = [
    "pillow",
    "pypdfium2",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
]
retrievers-paperqa = ["paper-qa>=2026.3.18"]
retrievers-hipporag = ["lightrag-hku>=1.4.16"]
retrievers-lazygraph = ["graphrag>=3.0.9"]
retrievers = [
    "paper-qa>=2026.3.18",
    "lightrag-hku>=1.4.16",
    "graphrag>=3.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pymilvus.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not e2e'"
# Per-test timeout (pytest-timeout). Hung tests fail individually instead of
# stalling the entire CI run for hours. Slow/e2e suites override via marker.
timeout = 60
timeout_method = "thread"
markers = [
    "slow: spawns the real mineru-api daemon; run explicitly with -m slow",
    "e2e: parses a real PDF end-to-end through ragctl run; -m e2e to run",
]
